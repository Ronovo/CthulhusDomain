name: Build Game

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Add permissions for artifact uploads
permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow
        pip install pyinstaller
        pip install pygame
    
    - name: Build Windows executable
      run: |
        cd Install_Files
        # Copy game files
        copy ..\Game_Logic\main.py .
        copy ..\Game_Logic\upgrades.py .
        copy ..\Game_Logic\menu.py .
        python setup_fonts.py
        python icon.py
        pyinstaller --clean ./build.spec
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: CthulhusDominion-Windows
        path: Install_Files/dist/CthulhusDominion.exe

  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install Pillow
        pip3 install pyinstaller
        pip3 install pygame
    
    - name: Build Mac DMG
      run: |
        cd Install_Files
        # Copy game files
        cp ../Game_Logic/main.py .
        cp ../Game_Logic/upgrades.py .
        cp ../Game_Logic/menu.py .
        python3 setup_fonts.py
        python3 icon.py
        pyinstaller --clean ./build.spec
        
        # Create DMG
        mkdir -p dmg_temp
        cp -r dist/CthulhusDominion.app dmg_temp/
        hdiutil create -volname "Cthulhu's Dominion" -srcfolder dmg_temp -ov -format UDZO "dist/CthulhusDominion.dmg"
        rm -rf dmg_temp
    
    - name: Upload Mac artifact
      uses: actions/upload-artifact@v4
      with:
        name: CthulhusDominion-Mac
        path: Install_Files/dist/CthulhusDominion.dmg

  create-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: CthulhusDominion-Windows
        path: dist
    
    - name: Download Mac artifact
      uses: actions/download-artifact@v4
      with:
        name: CthulhusDominion-Mac
        path: dist
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/CthulhusDominion.exe
          dist/CthulhusDominion.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 